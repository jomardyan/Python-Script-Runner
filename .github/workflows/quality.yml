name: Required quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,dashboard]' build pip-audit
      - run: python -m compileall -q runner.py runners WEBAPI
      - run: python -m pytest tests/unit -q
      - run: python -m pip_audit -r requirements.txt
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
