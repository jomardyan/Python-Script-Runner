name: Workflow history maintenance

on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Delete completed run history; false only previews the selection'
        type: boolean
        default: false
      confirmation:
        description: 'For deletion, enter the exact owner/repository name'
        type: string
        default: ''

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    name: Preview or explicitly delete completed runs
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify history maintenance behavior
        run: python -m unittest tests.test_workflow_runs -v
      - name: Preview or explicitly delete completed workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EXECUTE: ${{ inputs.execute }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          arguments=(--repo "$REPO" --current-run "$CURRENT_RUN_ID")
          if [[ "$EXECUTE" == true ]]; then
            arguments+=(--execute --confirm "$CONFIRMATION")
          fi
          python scripts/workflow_runs.py "${arguments[@]}"
