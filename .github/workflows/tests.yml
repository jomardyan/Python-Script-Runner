name: Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**.py'
      - 'requirements*.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**.py'
      - 'requirements*.txt'
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    name: Lint & Format Check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint runner.py
        run: |
          if command -v flake8 &> /dev/null; then
            flake8 runner.py --count --select=E9,F63,F7,F82 --show-source
          fi

      - name: Lint runners/ subpackages
        run: |
          if command -v flake8 &> /dev/null; then
            flake8 runners/ --count --select=E9,F63,F7,F82 --show-source
          fi

  unit-tests:
    runs-on: ${{ matrix.os }}
    name: Unit Tests - ${{ matrix.os }} / Python ${{ matrix.python-version }}
    env:
      PYTHONUTF8: "1"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Verify package structure
        run: |
          python -c "import runner; print(f'✅ Core: {runner.__version__}')"
          python -c "from runners.workflows import workflow_engine; print('✅ Workflows')"
          python -c "from runners.profilers import performance_profiler; print('✅ Profilers')"
          python -c "from runners.scanners import code_analyzer; print('✅ Scanners')"
          python -c "from runners.security import secret_scanner; print('✅ Security')"
          python -c "from runners.integrations import cloud_cost_tracker; print('✅ Integrations')"

      - name: Run unit tests
        run: |
          if [ -f "pytest.ini" ]; then
            python -m pytest tests/unit/ -v --tb=short --cov=runner --cov=runners
          else
            echo "⚠️ No pytest.ini found"
          fi

      - name: Run integration tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -d "tests/integration" ]; then
            python -m pytest tests/integration/ -v --tb=short
          fi

  api-tests:
    runs-on: ubuntu-latest
    name: WEBAPI Tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cd WEBAPI && pip install -r requirements.txt

      - name: Verify WEBAPI structure
        run: |
          python -c "import sys; sys.path.insert(0, 'WEBAPI'); from api import app; print('✅ FastAPI app loads')"

      - name: Check API endpoints
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'WEBAPI')
          from api import app
          routes = [route.path for route in app.routes]
          print('API Endpoints:')
          for route in sorted(routes):
              print(f'  - {route}')
          "

  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build Test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-checks:
    runs-on: ubuntu-latest
    name: Security Checks
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependency audit tool
        run: python -m pip install pip-audit

      - name: Audit pinned production dependencies
        run: python -m pip_audit -r requirements.txt

  performance-check:
    runs-on: ubuntu-latest
    name: Performance Check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-benchmark

      - name: Run performance tests
        run: |
          if [ -d "tests/performance" ]; then
            python -m pytest tests/performance/ -v --tb=short
          fi

  compatibility-check:
    runs-on: ubuntu-latest
    name: Compatibility Check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test PyPy3 compatibility
        uses: actions/setup-python@v7
        with:
          python-version: 'pypy-3.10'

      - name: Verify PyPy3 compatibility
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pypy3.txt 2>/dev/null || pip install -r requirements.txt
          python -m py_compile runner.py
          python -c "import runner; print(f'✅ PyPy3 compatibility OK: {runner.__version__}')"

  summary:
    runs-on: ubuntu-latest
    name: Test Summary
    if: always()
    needs: [lint-and-format, unit-tests, api-tests, docker-build, security-checks, performance-check, compatibility-check]
    
    steps:
      - name: Test Results
        run: |
          echo "📊 Test Execution Summary"
          echo "═══════════════════════════════════════════"
          echo "✅ Lint & Format: ${{ needs.lint-and-format.result }}"
          echo "✅ Unit Tests: ${{ needs.unit-tests.result }}"
          echo "✅ API Tests: ${{ needs.api-tests.result }}"
          echo "✅ Docker Build: ${{ needs.docker-build.result }}"
          echo "✅ Security: ${{ needs.security-checks.result }}"
          echo "✅ Performance: ${{ needs.performance-check.result }}"
          echo "✅ Compatibility: ${{ needs.compatibility-check.result }}"
          echo "═══════════════════════════════════════════"
          
          # Fail if any critical test failed
          if [ "${{ needs.unit-tests.result }}" = "failure" ]; then
            echo "❌ Unit tests failed"
            exit 1
          fi
          
          echo "✨ All test suites completed"

